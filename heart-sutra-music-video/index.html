<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>般若 · Heart Sutra music video</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f16; color: #e8e0cf; font: 14px/1.4 system-ui, sans-serif; }
  body { display: grid; place-items: center; overflow: hidden; }
  #view { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; display: block; cursor: pointer; }
  #ui { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 12px; align-items: center;
        opacity: 0.25; transition: opacity 0.3s; }
  #ui:hover, #ui:not(.playing) { opacity: 1; }
  #ui:not(.ready) #play { visibility: hidden; }
  #play { background: #e8e0cf; color: #0d0f16; border: 0; border-radius: 16px; padding: 6px 14px; font: inherit; cursor: pointer; }
  #ui.playing #play::after { content: 'Pause'; }
  #ui:not(.playing) #play::after { content: 'Play'; }
  #scrub { flex: 1; }
  #label { min-width: 12em; text-align: right; font-variant-numeric: tabular-nums; text-shadow: 0 0 6px #000; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<audio id="song" src="audio/song.m4a" preload="auto"></audio>
<div id="ui"><button id="play" aria-label="Play or pause"></button><input id="scrub" type="range" min="0" step="0.01" value="0"><span id="label">loading…</span></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
