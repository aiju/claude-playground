#
# Hercules configuration for OS/360 MVT 21.8F
#
# Adapted from conf/asp.conf in Kevin Leonard's turnkey MVT system.  The
# device addresses have to match the ones the system was generated with.
# Paths are relative to the directory Hercules is started in.
#

# The machine: one CPU and 8 MB of storage.  Hercules has no System/360
# mode; its oldest architecture is S/370, which runs S/360 programs as they
# are.  OS/360 is Y2K-naive, so the clock is set back 28 years, which keeps
# the days of the week right.

ARCHMODE  S/370
CPUSERIAL 000611
CPUMODEL  0158
MAINSIZE  8
NUMCPU    1
LOADPARM  ........
SYSEPOCH  1960 -28

# NIP sizes storage by probing it until it gets an addressing exception;
# don't log every program check.
OSTAILOR  QUIET

# 3270 terminals connect with tn3270 on this port
CNSLPORT  3270

# Card reader, punch and printers

000C    3505    * eof
000D    3525    pun/pch00d.txt ascii crlf
0002    3211    prt/prt002.txt crlf
000E    1403    prt/prt00e.txt crlf
000F    1403    prt/prt00f.txt crlf
011E    1403    log/aspout.txt crlf
011F    1403    log/mtout.txt crlf
030E    1403    log/hardcopy.txt crlf
030F    1403    log/mlog.txt crlf

# Consoles.  010 is the master console, a 3270; it has to be connected
# before the IPL.  01F is a 1052-style console built into the Hercules
# panel: type a slash and then an OS or HASP command, e.g. /d a

0010    3270
0014    3270
001F    3215-C / noprompt

# More 3270s, for TSO

00C0    3270
00C1    3270
00C2    3270
00C3    3270
00C4    3270
03C0    3270
03C1    3270
03C2    3270
03C3    3270
03C4    3270

# Disks

0130    2314    dasd/sorta0.130.cckd
0150    3330    dasd/aspres.150.cckd
0151    3330    dasd/aspsup.151.cckd
0152    3330    dasd/spool1.152.cckd
0154    3330    dasd/aspqvs.154.cckd
0158    3330    dasd/perma0.158.cckd
0159    3330    dasd/worka0.159.cckd
0250    3330    dasd/aspdlb.250.cckd

# Tape drives, empty

0580    3420    *
0581    3420    *
0582    3420    *
0583    3420    *
0584    3420    *
0585    3420    *
0586    3420    *
0587    3420    *
0588    3420    *
0589    3420    *
