<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tube Train</title>
<style>
  :root {
    --panel: rgba(20, 22, 26, 0.82);
    --ink: #eceae4;
    --muted: #a9adb3;
    --line: rgba(255, 255, 255, 0.14);
    --accent: #0098d4;        /* the Victoria line's light blue */
    --button: rgba(255, 255, 255, 0.08);
  }
  html, body { margin: 0; height: 100%; background: #16181c; color: var(--ink); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; font: 15px/1.4 ui-monospace, Menlo, monospace; color: var(--muted); }

  #panel { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: min(560px, calc(100% - 32px)); box-sizing: border-box;
           padding: 12px 14px 10px; border-radius: 12px; background: var(--panel); backdrop-filter: blur(6px);
           box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3); }
  #panel .head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  #panel .head strong { font-size: 15px; letter-spacing: 0.01em; }
  #panel .head .sub { color: var(--muted); flex: 1; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 6px 0; }
  .label { width: 44px; color: var(--muted); flex: none; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; min-width: 0; }
  button, select { font: inherit; color: var(--ink); background: var(--button); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
  button:hover, select:hover { background: rgba(255, 255, 255, 0.14); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  select { border-radius: 8px; padding: 4px 8px; max-width: 100%; }
  select option { color: #111; }
  #hide { background: none; border: 0; padding: 0 4px; color: var(--muted); font-size: 18px; line-height: 1; }
  #speed { flex: 1; min-width: 120px; accent-color: var(--accent); }
  #speedOut { width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
  .hint { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
  body:not([data-scene="depot"]) .depot-only, body:not([data-scene="tunnel"]) .tunnel-only { display: none; }
  #show { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: none; background: var(--panel); }
  body.bare #panel { display: none; }
  body.bare #show { display: block; }
  body.still #panel, body.still #show { display: none; }
  #minimap { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; width: 280px; height: 196px; display: none;
             border-radius: 12px; cursor: zoom-in; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3); }
  body[data-scene="tunnel"] #minimap { display: block; }
  body.nomap #minimap, body.still #minimap { display: none; }
  @media (max-width: 480px) {
    #minimap { top: calc(8px + env(safe-area-inset-top, 0px)); right: 8px; width: 190px; height: 140px; }
    #panel { left: 8px; right: 8px; max-width: none; padding: 8px 10px; }
    #panel .head { margin-bottom: 4px; }
    .row { margin: 4px 0; }
    .label { display: none; }
    button, select { padding: 3px 9px; }
    .hint { display: none; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="3D view of a Victoria line train"></canvas>
<div id="status">Building the train…</div>
<canvas id="minimap" role="img" aria-label="Map of the line" title="Click to zoom · M hides the map"></canvas>
<div id="panel" hidden>
  <div class="head"><strong>Tube train</strong><span class="sub">Victoria line · 2009 Stock</span><button id="hide" type="button" aria-label="Hide the controls" title="Hide (H)">×</button></div>
  <div class="row"><span class="label">Where</span>
    <div class="seg"><button type="button" data-scene="depot">Depot</button><button type="button" data-scene="tunnel">Tunnel</button><button type="button" data-scene="station">Station</button></div>
  </div>
  <div class="row"><span class="label">View</span><div class="seg" id="views"></div></div>
  <div class="row depot-only"><span class="label">Doors</span><button id="doors" type="button" title="D">Open doors</button></div>
  <div class="row tunnel-only"><span class="label">Speed</span>
    <input id="speed" type="range" min="0" max="80" step="1" value="54" aria-label="Speed in km/h" title="↑ ↓"><output id="speedOut">0 km/h</output>
    <button id="stops" type="button">Stop at stations</button>
  </div>
  <div class="row"><span class="label">To</span><select id="dest" aria-label="Destination on the front"></select>
    <button id="lights" type="button" title="L">Saloon lights</button><button id="sound" type="button" title="S">Sound</button>
  </div>
  <p class="hint">Drag to look around, scroll or pinch to zoom. Keys 1–5 pick a view, M shows or hides the map.</p>
</div>
<button id="show" type="button">Controls</button>
<script type="module" src="src/main.js"></script>
</body>
</html>
